<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Zeffalie Come Back</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  /* Le jeu occupe toute la page, sans marges ni barres de defilement */
  :root { --bg: #05081a; --text: #f2f2f2; --accent: #ffc83c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
               font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none;
           touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* Ecran de chargement */
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 16px; background: var(--bg); text-align: center; padding: 16px; }
  #loading img { width: 160px; height: 160px; border-radius: 32px; }
  #loading h1 { margin: 0; color: var(--accent); font-size: clamp(24px, 6vw, 44px); letter-spacing: 2px; }
  #bar { width: min(320px, 80vw); height: 8px; background: #1c2440; border-radius: 4px; overflow: hidden; }
  #bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  /* Telephone tenu en portrait : on demande de le tourner (le jeu est en paysage) */
  #rotate { display: none; position: fixed; inset: 0; background: var(--bg); align-items: center;
            justify-content: center; text-align: center; padding: 24px; font-size: 20px; z-index: 10; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="loading">
  <img src="icon.png" alt="">
  <h1>ZEFFALIE COME BACK</h1>
  <div id="bar"><div></div></div>
  <div id="status">Chargement...</div>
</div>
<div id="rotate">Tourne ton telephone en mode paysage pour jouer 🔄</div>
<canvas id="canvas" tabindex="-1"></canvas>
<script>
  // ZNet : reseau du jeu dans le navigateur (utilise par src/netsock_web.c).
  // Sur la page claude.ai du jeu, la capacite "room" relie tous ceux qui ont
  // la page ouverte, comme un serveur de jeu en ligne :
  //  - salon commun (lobby) : chaque hote y publie sa "presence" { g: ... }
  //    (code, joueurs, vague) ; tout le monde voit la liste des parties ;
  //  - une partie = un salon nomme "zcb-<code>" ;
  //  - client -> hote : le dernier paquet du client est sa presence { s: ... }
  //    (le relais la transmet jusqu'a ~30 fois par seconde, et n'importe quel
  //    joueur peut en publier une : pas besoin de droits particuliers) ;
  //  - hote -> clients : messages sur le sujet "p" ; l'etat du monde est
  //    diffuse en UN message pour tout le monde (t = "*"), le reste (accueil,
  //    refus) est adresse a un seul joueur.
  // Les paquets sont compresses (deflate) puis ecrits en base64 ; un message
  // de plus de 2900 octets est coupe en morceaux (un message room = 4 Ko au
  // plus). Comme en UDP, un paquet peut se perdre : le jeu s'en accommode.
  // Ailleurs (pas de window.claude), available() reste faux.
  var ZNet = (function () {
    var lobby = null, users = null, game = null, unsubs = [], session = 0, isHost = false, myLabel = null;
    var queue = [], idxOf = {}, labelOf = {}, nextIdx = 2, pktId = 0, partial = {}, lastK = {}, lastPres = 0;
    var announced = null, names = {}, asked = {};
    var FRAG = 2900, PRESENCE_MAX = 3200;
    var BYE = [0x42, 0x52, 0x53, 0x48, 6];   // paquet BYE du jeu (NET_MAGIC + PKT_BYE)
    var canZip = typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';
    if (window.claude && claude.use) {
      claude.use('room').then(function (r) { lobby = r; }).catch(function () {});
      claude.use('user').then(function (u) { users = u; }).catch(function () {});
    }
    function b64(bytes) {
      var s = '';
      for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(s);
    }
    function unb64(str) {
      var s = atob(str), a = new Uint8Array(s.length);
      for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
      return a;
    }
    function pipe(bytes, stream) {
      return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function (b) { return new Uint8Array(b); });
    }
    // Compression des paquets de plus de 600 octets (les petits n'y gagnent rien)
    function zip(bytes) {
      if (!canZip || bytes.length <= 600) return Promise.resolve({ d: bytes, z: 0 });
      return pipe(bytes, new CompressionStream('deflate-raw')).then(function (c) { return { d: c, z: 1 }; },
                                                                     function () { return { d: bytes, z: 0 }; });
    }
    function unzip(bytes, z) { return z ? pipe(bytes, new DecompressionStream('deflate-raw')) : Promise.resolve(bytes); }
    function push(from, bytes) { if (queue.length < 512) queue.push({ from: from, bytes: bytes }); }
    // Hote : numero de joueur reseau d'un participant (2, 3... dans l'ordre d'arrivee)
    function idx(peer) {
      if (!idxOf[peer]) { idxOf[peer] = nextIdx; labelOf[nextIdx] = peer; nextIdx++; }
      return idxOf[peer];
    }
    function me() {
      if (!myLabel && lobby) lobby.peers().forEach(function (p) { if (p.sameTab) myLabel = p.peer; });
      return myLabel;
    }
    // Message "p" recu : hote -> client(s), ou client -> hote quand le paquet
    // etait trop gros pour la presence. Les morceaux sont rassembles par (expediteur, k).
    function onMsg(m) {
      var d = m.data;
      if (m.sameTab || !d || typeof d.d !== 'string' || typeof d.n !== 'number' || d.n < 1 || d.n > 8
          || typeof d.f !== 'number' || d.f < 0 || d.f >= d.n) return;
      if (isHost ? d.t !== 'h' : (!d.h || (d.t !== '*' && d.t !== me()))) return;   // pas pour nous
      var from = isHost ? idx(m.peer) : 1;                                          // vu d'un client, l'hote = 1
      var key = m.peer + ':' + d.k, now = Date.now();
      var part = partial[key] || (partial[key] = { n: d.n, got: 0, chunks: [], t: now });
      if (part.chunks[d.f]) return;
      try { part.chunks[d.f] = unb64(d.d); } catch (e) { delete partial[key]; return; }
      if (++part.got < part.n) return;
      delete partial[key];
      for (var k in partial) if (now - partial[k].t > 3000) delete partial[k];   // morceaux orphelins
      var total = 0, o = 0;
      part.chunks.forEach(function (c) { total += c.length; });
      var all = new Uint8Array(total);
      part.chunks.forEach(function (c) { all.set(c, o); o += c.length; });
      unzip(all, d.z).then(function (bytes) { push(from, bytes); }).catch(function () {});
    }
    // Hote : presences des clients de la partie (le dernier paquet de chacun).
    // Un joueur qui ferme la page part du salon : on transmet au jeu un BYE de sa part.
    function onPeers(ch) {
      if (!isHost) return;
      ch.joined.concat(ch.updated).forEach(function (p) {
        var s = p.presence && p.presence.s;
        if (p.sameTab || !s || typeof s.d !== 'string' || s.k === lastK[p.peer]) return;
        lastK[p.peer] = s.k;
        var from = idx(p.peer), raw;
        try { raw = unb64(s.d); } catch (e) { return; }
        unzip(raw, s.z).then(function (bytes) { push(from, bytes); }).catch(function () {});
      });
      ch.left.forEach(function (p) { if (idxOf[p.peer]) push(idxOf[p.peer], new Uint8Array(BYE)); });
    }
    // Nom affiche pour une partie : "Partie de <prenom de l'hote>", sans accents
    // (la police du jeu n'a que l'ASCII) ; les noms arrivent un peu apres.
    function nameOf(p, code) {
      var by = p.by;
      if (users && by && !asked[by]) {
        asked[by] = true;
        users.profiles([by]).then(function (ps) { if (ps && ps[by] && ps[by].name) names[by] = ps[by].name; }).catch(function () {});
      }
      var n = (by && names[by]) || '';
      n = n.split(' ')[0].normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7e]/g, '').replace(/\|/g, ' ').slice(0, 24);
      return n ? 'Partie de ' + n : 'Partie ' + code;
    }
    function num(x) { x = x | 0; return x < 0 ? 0 : (x > 999 ? 999 : x); }
    return {
      available: function () { return !!lobby; },
      open: function (code, host) {
        this.close();
        isHost = host; myLabel = null; idxOf = {}; labelOf = {}; nextIdx = 2; queue = []; partial = {}; lastK = {}; lastPres = 0;
        var token = session;
        lobby.join('zcb-' + code).then(function (g) {
          if (token !== session) return;           // partie quittee entre-temps
          game = g;
          unsubs.push(g.on('p', onMsg), g.onPeers(onPeers));
        }).catch(function (e) { console.log('ZNet : salon indisponible', e && e.code); });
      },
      close: function () {
        session++;
        unsubs.forEach(function (u) { u(); });
        unsubs = [];
        if (game) game.leave().catch(function () {});
        game = null;
        if (announced && lobby) lobby.presence({ g: null }).catch(function () {});
        announced = null;
      },
      // to : 0 = tous les clients (hote), sinon numero du destinataire
      send: function (to, bytes) {
        var g = game;
        var target = isHost ? (to === 0 ? '*' : labelOf[to]) : 'h';
        if (!g || !target) return false;
        var k = pktId = (pktId + 1) % 1000000000;
        zip(bytes).then(function (r) {
          if (g !== game) return;
          if (!isHost) {
            // Client : le paquet devient sa presence, s'il y tient (sinon message classique)
            var str = b64(r.d);
            if (str.length <= PRESENCE_MAX) {
              if (k < lastPres) return;               // un paquet plus recent est deja parti
              lastPres = k;
              g.presence({ s: { k: k, z: r.z, d: str } }).catch(function () {});
              return;
            }
          }
          var n = Math.max(1, Math.ceil(r.d.length / FRAG));
          if (n > 8) return;
          for (var f = 0; f < n; f++)
            g.emit('p', { t: target, h: isHost ? 1 : 0, k: k, f: f, n: n, z: r.z, d: b64(r.d.subarray(f * FRAG, (f + 1) * FRAG)) })
              .catch(function () {});
        });
        return true;
      },
      recv: function () { return queue.shift() || null; },
      // Hote : annonce de la partie dans le salon commun (envoyee seulement si elle change)
      announce: function (info) {
        if (!lobby || !game) return;
        var str = JSON.stringify(info);
        if (str === announced) return;
        announced = str;
        lobby.presence({ g: info }).catch(function () {});
      },
      // Parties annoncees par les autres : une ligne "code|joueurs|max|vague|lancee|nom" par partie
      games: function () {
        if (!lobby) return '';
        var out = [];
        lobby.peers().forEach(function (p) {
          var g = p.presence && p.presence.g;
          if (p.sameTab || !g || typeof g.c !== 'number' || g.c < 1000 || g.c > 9999) return;
          out.push([g.c, num(g.n), num(g.m), num(g.w), g.p ? 1 : 0, nameOf(p, g.c)].join('|'));
        });
        return out.slice(0, 40).join('\n');
      }
    };
  })();
</script>
<script>
  var canvas = document.getElementById('canvas');
  // Clic droit = viser : pas de menu contextuel du navigateur
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // Les fleches, l'espace... ne doivent pas faire defiler la page
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].indexOf(e.key) >= 0) e.preventDefault();
  });
  // Plein ecran sur telephone au premier toucher (cache la barre d'adresse)
  canvas.addEventListener('touchend', function () {
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
  }, { once: true });
  var Module = {
    canvas: canvas,
    print: function (t) { console.log(t); },
    setStatus: function (t) {
      var m = t.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) document.querySelector('#bar div').style.width = (100 * m[1] / m[3]) + '%';
      if (t) document.getElementById('status').textContent = t.replace(/\(.*\)/, '');
    },
    onRuntimeInitialized: function () {
      started = true;
      document.getElementById('loading').style.display = 'none';
      canvas.focus();
    },
    // Echec du chargement : on l'ecrit au lieu de rester sur "Chargement..."
    onAbort: function (what) { showError('Le jeu n\'a pas pu demarrer (' + what + ').'); }
  };
  var started = false;
  function showError(msg) {
    var st = document.getElementById('status');
    st.style.color = '#ff7a6a';
    st.textContent = msg + ' Essaie avec un navigateur recent (Chrome, Edge, Firefox, Safari).';
  }
  window.addEventListener('error', function (e) { if (!started) showError('Erreur : ' + (e.message || e)); });
  setTimeout(function () { if (!started) showError('Le chargement est tres long.'); }, 45000);
</script>

</body>
</html>
