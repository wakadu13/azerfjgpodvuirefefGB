name: Build

# Compile le jeu pour macOS (Apple Silicon), Windows, Linux, Android et iOS,
# puis le lance dans un emulateur Android et un simulateur iOS (captures
# d'ecran publiees sur la branche "ci-captures").
# - Sur chaque pull request : les executables sont disponibles dans l'onglet
#   Actions (section "Artifacts" du run).
# - Sur chaque push sur main : ils sont publies dans la release "latest".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Compiler (raylib telechargee par CMake)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --config Release -j 4

      - name: Creer ZeffalieComeBack.app
        run: |
          sh scripts/make_macos_app.sh build/zeffalie_come_back dist
          file dist/ZeffalieComeBack.app/Contents/MacOS/ZeffalieComeBack

      - uses: actions/upload-artifact@v4
        with:
          name: ZeffalieComeBack-macOS-arm64
          path: dist/ZeffalieComeBack-macOS-arm64.zip

  windows:
    name: Windows (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Compiler raylib 5.5 pour Windows
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git raylib-win
          make -C raylib-win/src PLATFORM=PLATFORM_DESKTOP OS=Windows_NT CC=x86_64-w64-mingw32-gcc AR=x86_64-w64-mingw32-ar -j 4

      - name: Compiler le jeu
        run: |
          make windows RAYLIB_WIN_PATH=raylib-win
          mkdir -p dist && cp release/ZeffalieComeBack.exe dist/ZeffalieComeBack-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ZeffalieComeBack-windows-x64
          path: dist/ZeffalieComeBack-windows-x64.exe

  web:
    name: Navigateur (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Compiler raylib 5.5 pour le web
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git raylib-web
          make -C raylib-web/src PLATFORM=PLATFORM_WEB -j 4

      - name: Compiler le jeu
        run: |
          bash scripts/build_web.sh raylib-web build-web
          mkdir -p dist && (cd build-web && zip -qr ../dist/ZeffalieComeBack-web.zip .)

      # Le site (index.html + .js + .wasm) pour GitHub Pages et la release
      - uses: actions/upload-artifact@v4
        with:
          name: ZeffalieComeBack-web
          path: dist/ZeffalieComeBack-web.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-web

  # Mise en ligne sur GitHub Pages (jouable a l'adresse https://<compte>.github.io/<depot>/).
  # Il faut l'activer une fois : Settings > Pages > Source = "GitHub Actions"
  # (sur un depot prive, GitHub Pages demande un compte payant). Tant que ce
  # n'est pas fait, cette etape echoue sans bloquer le reste.
  pages:
    name: Mettre en ligne (GitHub Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev

      - name: Compiler
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          mkdir -p dist && tar -czf dist/ZeffalieComeBack-linux-x64.tar.gz -C build zeffalie_come_back

      - uses: actions/upload-artifact@v4
        with:
          name: ZeffalieComeBack-linux-x64
          path: dist/ZeffalieComeBack-linux-x64.tar.gz

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sources raylib 5.5
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git raylib-src

      - name: Compiler l'APK
        run: |
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          RAYLIB_SRC="$PWD/raylib-src" OUT=build-android bash scripts/build_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ZeffalieComeBack-android
          path: build-android/ZeffalieComeBack-android.apk

  android-test:
    name: Android (test sur emulateur)
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ZeffalieComeBack-android

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer le jeu dans l'emulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android_smoke_test.sh ZeffalieComeBack-android.apk captures

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-android
          path: captures

  ios:
    name: iOS (iPhone / iPad)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Sources raylib 5.5 et SDL 2.30
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git raylib-src
          git clone --depth 1 --branch release-2.30.8 https://github.com/libsdl-org/SDL.git sdl-src

      - name: Compiler pour iPhone (.ipa) et pour le simulateur
        run: |
          export RAYLIB_SRC="$PWD/raylib-src" SDL_SRC="$PWD/sdl-src"
          bash scripts/build_ios.sh device
          bash scripts/build_ios.sh simulator

      - uses: actions/upload-artifact@v4
        with:
          name: ZeffalieComeBack-iOS
          path: build-ios-device/ZeffalieComeBack-iOS.ipa

      - name: Lancer le jeu dans le simulateur iOS
        run: bash scripts/ios_smoke_test.sh build-ios-simulator/ZeffalieComeBack.app captures

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-ios
          path: captures

  captures:
    name: Publier les captures (branche ci-captures)
    needs: [android-test, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: captures-*
          path: captures
          merge-multiple: true

      - name: Pousser sur la branche ci-captures
        run: |
          mkdir -p captures && cd captures
          echo "Captures du run ${{ github.run_id }} (commit ${{ github.sha }})" > README.md
          git init -q && git checkout -q -b ci-captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Captures CI ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-captures

  release:
    name: Publier la release "latest"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [macos-arm64, windows, linux, android, ios, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ZeffalieComeBack-*
          path: dist
          merge-multiple: true

      - name: Remplacer la release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --target "${{ github.sha }}" \
            --title "ZEFFALIE COME BACK - derniere version" \
            --notes "Executables compiles automatiquement depuis main : Windows (.exe), macOS Apple Silicon (.zip contenant ZeffalieComeBack.app), Linux (.tar.gz), Android (.apk), iOS (.ipa non signee, a installer avec Sideloadly ou AltStore) et version navigateur (ZeffalieComeBack-web.zip, a mettre sur un serveur web)."
